<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#fff" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voice handshake: AI caller, spoken declaration, verify_delegation, scoped token, step-up to the holder">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1915"/></marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
  </defs>
  <g font-family="Geist Mono, monospace" font-size="9" fill="#6f6b62" letter-spacing=".4">
    <text x="0" y="12">0  EMERGENCY FIRST</text>
    <text x="0" y="74">1</text><text x="140" y="74">2</text><text x="280" y="74">3</text><text x="420" y="74">4</text><text x="560" y="74">5</text>
  </g>
  <line x1="0" y1="22" x2="680" y2="22" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="0" y="40" font-family="Geist, sans-serif" font-size="10.5" fill="#1a1915">Gas leak, outage or operator request → emergency number 800 000 999 / transfer, before any identity step, whoever calls</text>
  <g font-family="Geist, sans-serif" fill="#1a1915">
    <rect x="0" y="82" width="118" height="62" fill="#ffffff" stroke="#1a1915"/>
    <text x="10" y="104" font-size="12" font-weight="600">AI caller</text>
    <text x="10" y="120" font-size="10">personal agent,</text>
    <text x="10" y="133" font-size="10">phone or cloud line</text>
    <rect x="140" y="82" width="118" height="62" fill="#ffffff" stroke="#1a1915"/>
    <text x="150" y="104" font-size="12" font-weight="600">Declares itself</text>
    <text x="150" y="120" font-size="10">"I'm an AI agent</text>
    <text x="150" y="133" font-size="10">calling for a customer"</text>
    <rect x="280" y="82" width="118" height="62" fill="#f5f3ee" stroke="#1a1915"/>
    <text x="288" y="104" font-size="10" font-weight="500" font-family="Geist Mono, monospace">verify_delegation</text>
    <text x="290" y="120" font-size="10">agent id + code,</text>
    <text x="290" y="133" font-size="10">keyed by DTMF</text>
    <rect x="420" y="82" width="118" height="62" fill="#ffffff" stroke="#1a1915"/>
    <text x="430" y="104" font-size="12" font-weight="600">Scoped token</text>
    <text x="430" y="120" font-size="10">bound to customer,</text>
    <text x="430" y="133" font-size="10">agent, scopes, expiry</text>
    <rect x="560.5" y="82" width="118" height="62" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <text x="570" y="104" font-size="12" font-weight="600">Step-up</text>
    <text x="570" y="120" font-size="10">a write needs the</text>
    <text x="570" y="133" font-size="10">holder (app push)</text>
  </g>
  <g stroke="#1a1915" stroke-width="1" fill="none">
    <line x1="118" y1="113" x2="138" y2="113" marker-end="url(#ah)"/>
    <line x1="258" y1="113" x2="278" y2="113" marker-end="url(#ah)"/>
    <line x1="398" y1="113" x2="418" y2="113" marker-end="url(#ah)"/>
    <line x1="538" y1="113" x2="558" y2="113" marker-end="url(#aa)" stroke="#b45309"/>
  </g>
  <g font-family="Geist, sans-serif" font-size="9.5" fill="#55524a">
    <line x1="0" y1="160" x2="680" y2="160" stroke="#dcd8ce"/>
    <text x="0" y="178">undeclared caller →</text><text x="0" y="191">human path (KBA);</text><text x="0" y="204">detection logs it</text>
    <text x="140" y="178">never asked for the</text><text x="140" y="191">birth date; no account</text><text x="140" y="204">facts before step 3</text>
    <text x="280" y="178">any failure → same</text><text x="280" y="191">answer; repeats lock</text><text x="280" y="204">out silently</text>
    <text x="420" y="178">reads served within</text><text x="420" y="191">scope; receipt with</text><text x="420" y="204">agent id in audit log</text>
    <text x="560" y="178">third "can you</text><text x="560" y="191">repeat?" → end_call,</text><text x="560" y="204">at any step</text>
  </g>
  <text x="0" y="230" font-family="Geist Mono, monospace" font-size="8.5" fill="#6f6b62">FIG. 1  THE VOICE HANDSHAKE. THE BACK OFFICE, NOT THE PROMPT, DECIDES AT STEPS 3–5.</text>
</svg>